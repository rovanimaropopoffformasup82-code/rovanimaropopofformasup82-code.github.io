<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Contactez Mercia RANDRIANOME — Designer UI & Intégratrice Web.">
    <title>Contact | Mercia RANDRIANOME</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/contact.css">
    <link rel="stylesheet" href="css/chatbot.css">
</head>
<body>

    <header class="header">
        <div class="nav">
            <a href="index.html" class="nav-logo">MERCIA<span>.</span></a>
            <a href="contact.html" class="nav-cta">Me contacter</a>
            <div class="nav-burger">
                <span></span><span></span><span></span>
            </div>
        </div>
        <nav class="nav-sub">
            <ul class="nav-liens">
                <li><a href="index.html">Accueil</a></li>
                <li><a href="projets.html">Projets</a></li>
                <li><a href="mesoutils.html">Mes outils</a></li>
                <li><a href="contact.html" class="actif">Contact</a></li>
            </ul>
        </nav>
    </header>

    <!-- Fond : bruit SVG + halo radial -->
    <div class="contact-bg" aria-hidden="true">
        <svg class="bg-noise" xmlns="http://www.w3.org/2000/svg" width="100%" height="100%">
            <filter id="grain">
                <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/>
                <feColorMatrix type="saturate" values="0"/>
            </filter>
            <rect width="100%" height="100%" filter="url(#grain)"/>
        </svg>
        <div class="bg-halo"></div>
    </div>

    <div class="page-contact">
        <div class="contact-wrap">

            <header class="contact-header">
                <div class="contact-eyebrow">
                    <span class="eyebrow-ligne"></span>
                    <span class="eyebrow-label">Discutons</span>
                </div>
                <h1>Parlons de votre <em>projet</em></h1>
            </header>

            <!--
                CONNECTEUR O2SWITCH
                Une fois hébergé, créer send.php à la racine.
                Le formulaire poste en POST : nom, email, service, message.
                Retirer l'attribut novalidate pour activer la validation native.
            -->
            <form class="contact-form" method="POST" action="send.php" novalidate>

                <!-- Honeypot anti-spam — ne pas supprimer -->
                <input type="text" name="_honeypot" tabindex="-1" autocomplete="off" aria-hidden="true" style="display:none">

                <div class="form-row">
                    <div class="form-field">
                        <label for="nom">Nom</label>
                        <input type="text" id="nom" name="nom" autocomplete="name" placeholder="Prénom Nom" required>
                    </div>
                    <div class="form-field">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" autocomplete="email" placeholder="vous@exemple.fr" required>
                    </div>
                </div>

                <div class="form-field">
                    <label for="service">Type de projet</label>
                    <select id="service" name="service">
                        <option value="">Choisir…</option>
                        <option value="dev">Développement Site Web</option>
                        <option value="visuel">Conception Visuelle</option>
                        <option value="autre">Autre / Je ne sais pas encore</option>
                    </select>
                </div>

                <div class="form-field">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" rows="5" placeholder="Décrivez votre projet en quelques lignes…" required></textarea>
                </div>

                <div class="form-footer">
                    <span class="form-delai">
                        <span class="dot-pulsant" aria-hidden="true"></span>
                        Réponse sous 24 h
                    </span>
                    <button type="submit" class="btn-envoyer">
                        <span class="btn-label">Envoyer</span>
                        <span class="btn-fleche" aria-hidden="true">→</span>
                    </button>
                </div>

            </form>

            <p class="contact-email">
                Ou directement : <a href="mailto:mercia.randrianome@gmail.com">mercia.randrianome@gmail.com</a>
            </p>

        </div>
    </div>

    <footer class="footer">
        <div class="footer-contenu">
            <p class="footer-logo">MERCIA<span>.</span></p>
            <div class="footer-liens">
                <a href="projets.html">Projets</a>
                <a href="contact.html">Contact</a>
            </div>
            <p class="footer-copyright">© 2026 Mercia RANDRIANOME — Designer UI &amp; Intégratrice Web</p>
        </div>
    </footer>

    <script src="js/main.js"></script>
    <script src="js/chatbot.js"></script>
</body>
</html>
