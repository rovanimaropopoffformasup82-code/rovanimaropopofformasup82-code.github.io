      background: #0d0d0d;
      overflow: hidden;
      height: 100dvh;
      display: flex;
      flex-direction: column;
    }
    .header {
      flex-shrink: 0;
    }
    section.outils {

    section.outils #scene {
      height: 100%;

    }

<body>

  <header class="header">
    <div class="nav">
      <a href="index.html" class="nav-logo">MERCIA<span>.</span></a>

      <div class="nav-burger">

      </div>

    <nav class="nav-sub">

  <section class="outils">
    <div id="scene">
      <p class="outils-titre">Mes outils de conception</p>

        <div class="orbit-anneau"></div>
        <div class="orbit-bras"><div class="planet"></div></div>

      <img id="lb-img" src="" alt="">
      <button id="lb-close" aria-label="Fermer">&#x2715;</button>
